<!doctype html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC-Folks · Buku Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;800;900&family=Barlow+Condensed:wght@600;700&family=Questrial&display=swap" rel="stylesheet">
<style>
:root{--red:#AD2323;--cream:#FEF2E1;--brown:#422C27;--muted:#6B5650;--line:#EADCC6;--field:#D9C6A8;--lock:#F1E7D8;--ok:#E3F1E4;--okb:#9CCBA6;--okt:#1F5A33;--blue:#EAF1FA;--warn:#FFF4D6;--burg:#6C1925;--gold:#FFD288}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--brown);font-family:Questrial,Arial,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;color:inherit}
.hd{background:var(--red);color:var(--cream);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd .k{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--gold)}
.hd h1{margin:2px 0 0;font-family:'League Spartan',sans-serif;font-weight:800;font-size:21px;line-height:1.1}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.who b{background:var(--cream);color:var(--red);border-radius:999px;padding:5px 12px;font-family:'League Spartan',sans-serif;font-size:14px}
.who button{background:none;border:none;color:var(--cream);font-size:12px;text-decoration:underline;cursor:pointer;padding:2px}
.nav{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:4}
.nav button{flex-shrink:0;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
.nav button.on{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.nav .sep{flex-shrink:0;width:1px;background:var(--line);margin:4px 2px}
.nav button.own{border-color:var(--red);color:var(--red)}.nav button.own.on{background:var(--red);color:#fff}
main{max-width:720px;margin:0 auto;padding:16px 14px 90px;display:flex;flex-direction:column;gap:14px}
.lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.hint{font-size:13px;color:var(--muted);line-height:1.4}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.red{border:2px solid var(--red)}.card.dark{border:2px solid var(--brown)}.card.blue{background:var(--blue);border-color:#B9CDE6}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:14px;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line);font-size:15px}
.row.done{background:var(--ok);border-color:var(--okb)}.row.done .nm{color:var(--okt)}
.row.late{border:2px solid var(--red)}.row.late .nm{color:var(--red)}
.row .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.nm{font-size:16px;font-weight:700}.sub{font-size:12px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap;background:var(--lock)}
.chip.ok{background:#C9E6CF;color:var(--okt)}.chip.bad{background:var(--red);color:#fff}.chip.warn{background:var(--gold)}.chip.blue{background:var(--blue);color:#24466B}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input.i.cari{border-style:dashed;margin-bottom:2px;background:#fff}
input.i,select.i,textarea.i{height:44px;border:1px solid var(--field);border-radius:10px;padding:0 12px;font-size:16px;background:#FFFDF8;width:100%}
textarea.i{height:auto;padding:10px 12px;resize:vertical}
input.big{height:50px;border:2px solid var(--brown);font-size:20px}
.lock{height:44px;border-radius:10px;padding:0 12px;background:var(--lock);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:400}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:48px;border-radius:12px;border:none;background:var(--red);color:var(--cream);font-family:'League Spartan',sans-serif;font-weight:800;font-size:16px;cursor:pointer;width:100%}
.btn:disabled{opacity:.6}
.btn2{height:44px;border-radius:12px;border:1px solid var(--field);background:#fff;font-size:15px;cursor:pointer}
.btn2.on{background:var(--brown);color:var(--cream);border-color:var(--brown);font-family:'League Spartan',sans-serif;font-weight:800}
.back{align-self:flex-start;background:none;border:none;color:var(--red);font-size:15px;min-height:44px;cursor:pointer;padding:0}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.note.ok{background:var(--ok);color:var(--okt)}.note.warn{background:var(--warn);border:2px solid #ED5F1E}.note.err{background:#FBE3E3;color:#8A1C1C}.note.info{background:var(--warn)}
.ck{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid #F3E6D2;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:#2E7D46;flex-shrink:0}
.ck .q{font-family:'League Spartan',sans-serif;font-weight:800;font-size:16px;white-space:nowrap}
.photo{display:flex;flex-direction:column;gap:6px}
.photo .shot{height:72px;border:2px dashed var(--field);border-radius:12px;background:#FFFDF8;font-size:14px;cursor:pointer}
.photo img{max-height:160px;border-radius:10px;object-fit:cover}
.photo input{display:none}
.todo{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.todo.done{background:var(--ok);border-color:var(--okb)}
.todo input{width:24px;height:24px;accent-color:#2E7D46;flex-shrink:0}
.todo .jam{font-family:'League Spartan',sans-serif;font-weight:800;width:46px;flex-shrink:0}
.link{background:none;border:none;padding:0;text-align:left;font-size:15px;color:var(--red);text-decoration:underline;cursor:pointer;min-height:32px}
.saldo{background:var(--burg);color:var(--cream);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.saldo b{font-family:'League Spartan',sans-serif;font-weight:900;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;border-bottom:2px solid var(--brown);padding:8px 6px}td{padding:8px 6px;border-bottom:1px solid #F3E6D2;vertical-align:top}
.tbl{overflow-x:auto}
#toast{position:fixed;left:14px;right:14px;bottom:18px;max-width:560px;margin:0 auto;background:var(--okt);color:#fff;border-radius:14px;padding:14px 16px;text-align:center;z-index:9}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:20px}
h2{margin:0;font-family:'League Spartan',sans-serif;font-weight:800;font-size:20px}
.spin{opacity:.5}
</style>
</head>
<body>
<div id="boot" class="center"><h2>BC-Folks · Buku Staff</h2><p class="hint">Memuat…</p></div>

<div id="login" class="center" hidden>
  <h2>Masuk</h2>
  <label class="f">Nama<select id="l-name" class="i"></select></label>
  <label class="f">PIN<input id="l-pin" class="i big" type="password" inputmode="numeric" autocomplete="off"></label>
  <button id="l-go" class="btn" type="button">Masuk</button>
  <div id="login-msg"></div>
</div>

<div id="app" hidden>
  <div class="hd">
    <div><div class="k">BCFOLKS · BUKU STAFF</div><h1 id="title">To-do hari ini</h1></div>
    <div class="who"><b id="me"></b><button id="refresh" type="button">Muat ulang</button></div>
  </div>
  <nav class="nav" id="nav" aria-label="Halaman"></nav>
  <main id="main"></main>
</div>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var KEY = 'bcfolks_staff_v1';   // sama dengan versi 1, jadi HP staff tetap masuk tanpa PIN ulang
  // Link /exec yang dipakai halaman GitHub Pages (deployment aktif, URL tetap sama setiap rilis)
  var API_URL = 'https://script.google.com/macros/s/AKfycbwnjyBfmLT9lNzy6iNxfA4BGARQV1XOdl95tvS76vEQlERnUrEFE6vi80_zKol02KJspQ/exec';
  var S = { token: null, name: '', boot: null, page: 'todo', sel: null, dash: null, kasMode: 'keluar', kasEdit: null, checks: {} };
  var PAGES = [['todo', '1 To-do', 'To-do hari ini'], ['kas', '2 Kas Kecil', 'Kas Kecil'], ['harian', '3 Produksi Harian', 'Produksi Harian'],
               ['masuk', '4 Barang Masuk', 'Barang Masuk'], ['olahan', '5 Bahan Olahan', 'Produksi Bahan Olahan'], ['buka', '6 Buka Pack', 'Buka Pack Baru'],
               ['waste', '7 Waste', 'Barang Waste'], ['hitung', '8 Hitung Stok', 'Hitung Stok Harian']];
  var OWN = [['o-todo', 'To-do saya', 'To-do Bu Sicillia'], ['o-plan', 'Rencana produksi', 'Rencana Produksi'], ['o-dash', 'Dashboard', 'Dashboard'], ['o-log', 'Aktivitas', 'Aktivitas Staff']];

  /* ---------- alat ---------- */
  function $(id) { return document.getElementById(id); }
  function h(tag, attrs) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'text') e.textContent = v; else if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v; else if (k === 'checked') e.checked = !!v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, c) { if (c === null || c === undefined || c === false) return; if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; } e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function store(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
  function stored() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function fmt(n) { n = Number(n); if (!isFinite(n)) return '-'; return n.toLocaleString('id-ID', { maximumFractionDigits: n >= 100 ? 0 : 1 }); }
  function rp(n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }
  function parseNum(s) {
    s = String(s == null ? '' : s).replace(/\s/g, ''); if (!s) return '';
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(',', '.');
    return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
  }
  function dmy(ymd) { if (!ymd) return ''; var p = ymd.split('-'); return p[2] + '/' + p[1]; }
  function today() { return S.boot ? S.boot.today : ''; }
  function item(sku) { var l = S.boot.items; for (var i = 0; i < l.length; i++) if (l[i].sku === sku) return l[i]; return null; }
  function nama(sku) { var it = item(sku); return it ? it.nama : sku; }
  function lockBox(t) { return h('div', { class: 'lock' }, lockIcon(), t); }
  function lockIcon() { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', '14'); s.setAttribute('height', '14'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"></path>'; return s; }
  function field(label, input) { return h('label', { class: 'f' }, label, input); }
  function inp(attrs) { attrs = attrs || {}; attrs.class = 'i' + (attrs.big ? ' big' : ''); delete attrs.big; return h('input', attrs); }
  function dateInp(v) { return inp({ type: 'date', value: v || today(), max: today() }); }
  function sel(opts, value, ph) {
    var s = h('select', { class: 'i' });
    if (ph) s.appendChild(h('option', { value: '', text: ph }));
    opts.forEach(function (o) { var op = h('option', { value: o[0], text: o[1] }); if (o[0] === value) op.selected = true; s.appendChild(op); });
    if (opts.filter(function (o) { return /^[A-Z]{2,4}\d{3}$/.test(o[0]); }).length > 3) s.setAttribute('data-cari', '1');
    return s;
  }

  /* ---------- kolom pencarian (daftar & dropdown barang > 3) ---------- */
  function norm(t) { return String(t || '').toLowerCase().replace(/\s+/g, ' '); }
  function cocok(text, q) { var t = norm(text); return norm(q).split(' ').every(function (w) { return !w || t.indexOf(w) >= 0; }); }
  function cariBox(ph, onInput) {
    var i = h('input', { type: 'search', class: 'i cari', placeholder: ph, autocomplete: 'off', 'aria-label': ph });
    i.addEventListener('input', function () { onInput(i.value); });
    return i;
  }
  function pasangCari(m) {
    // Dropdown barang: kotak cari di atas dropdown, isi dropdown ikut tersaring
    Array.prototype.forEach.call(m.querySelectorAll('select[data-cari]'), function (s) {
      var semua = Array.prototype.map.call(s.options, function (o) { return { v: o.value, t: o.text }; });
      var box = cariBox('Cari barang (nama / SKU)…', function (q) {
        var cur = s.value, hasil = semua.filter(function (o) { return !o.v || cocok(o.v + ' ' + o.t, q); });
        clear(s); hasil.forEach(function (o) { s.appendChild(h('option', { value: o.v, text: o.t })); });
        if (!hasil.filter(function (o) { return o.v; }).length) s.appendChild(h('option', { value: '', text: 'Tidak ada yang cocok', disabled: true }));
        var masih = hasil.some(function (o) { return o.v === cur; });
        // Dropdown dengan placeholder ("Hitung barang lain…") tidak dipilih otomatis; yang lain pilih hasil pertama
        var skor = function (o) { var nm = norm(o.t.replace(/^\S+\s/, '')), w = norm(q).split(' ')[0]; return nm.indexOf(w) === 0 ? 0 : (' ' + nm).indexOf(' ' + w) >= 0 ? 1 : 2; };
        var terbaik = hasil.filter(function (o) { return o.v; }).sort(function (a, b) { return skor(a) - skor(b); })[0];
        var pilih = masih ? cur : semua[0] && semua[0].v === '' ? '' : (terbaik || {}).v;
        if (pilih != null) s.value = pilih;
        if (s.value !== cur && s.value) s.dispatchEvent(new Event('change'));
      });
      s.parentNode.insertBefore(box, s);
    });
    // Daftar barang (baris yang bisa diklik): kotak cari di atas daftar
    var rows = m.querySelectorAll('button.row');
    if (rows.length > 3) {
      var first = rows[0], anchor = first.previousElementSibling && first.previousElementSibling.classList.contains('lbl') ? first.previousElementSibling : first;
      var kosong = note('info', 'Tidak ada yang cocok.'); kosong.hidden = true;
      var box = cariBox('Cari di daftar ini…', function (q) {
        var n = 0;
        Array.prototype.forEach.call(rows, function (r) { var ok = cocok(r.textContent, q); r.hidden = !ok; if (ok) n++; });
        kosong.hidden = n > 0;
      });
      anchor.parentNode.insertBefore(box, anchor);
      anchor.parentNode.insertBefore(kosong, anchor);
    }
  }
  function itemOpts(filter) { return S.boot.items.filter(filter || function () { return true; }).map(function (it) { return [it.sku, it.label]; }); }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
  function note(kind, text) { return h('div', { class: 'note ' + kind, role: kind === 'err' ? 'alert' : 'status' }, text); }
  function back() { return h('button', { class: 'back', type: 'button', text: '← Kembali ke daftar', onclick: function () { S.sel = null; render(); } }); }

  /* ---------- server ---------- */
  function call(action, payload) {
    return new Promise(function (resolve, reject) {
      var req = { action: action, token: S.token }; for (var k in (payload || {})) req[k] = payload[k];
      var fin = function (r) {
        if (r && r.ok) return resolve(r.data);
        var e = new Error((r && r.error) || 'Gagal. Coba lagi.'); e.code = (r && r.code) || ''; reject(e);
      };
      // Dibuka dari GitHub Pages (bukan dari Apps Script): kirim lewat doPost
      if (!(window.google && google.script && google.script.run)) {
        fetch(API_URL, { method: 'POST', body: JSON.stringify(req), redirect: 'follow', credentials: 'omit' })
          .then(function (x) { return x.json(); }).then(fin)
          .catch(function () { var e = new Error('Tidak tersambung. Cek internet, lalu tekan simpan lagi.'); e.net = true; reject(e); });
        return;
      }
      google.script.run.withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        var e = new Error((r && r.error) || 'Gagal. Coba lagi.'); e.code = (r && r.code) || ''; reject(e);
      }).withFailureHandler(function () { var e = new Error('Tidak tersambung. Cek internet, lalu tekan simpan lagi.'); e.net = true; reject(e); }).api(req);
    });
  }
  function nonce() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function hash(str) { var x = 5381; for (var i = 0; i < str.length; i++) x = ((x << 5) + x + str.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
  /** Simpan satu isian. Tekan ulang tidak membuat dobel. */
  function save(btn, box, action, data, done) {
    if (btn.disabled) return;
    if (!btn._n) btn._n = nonce();
    var label = btn.textContent; btn.disabled = true; btn.textContent = 'Menyimpan…'; clear(box);
    call(action, { data: data, rid: btn._n + '-' + hash(JSON.stringify(data)) }).then(function (out) {
      btn.disabled = false; btn.textContent = label; btn._n = null;
      if (out.dyn) S.boot.dyn = out.dyn;
      toast('Tersimpan ✓'); if (done) done(out.res || {}); render();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = label;
      if (e.code === 'AUTH') return toLogin(e.message);
      add(box, note('err', e.message)); box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
  }

  /* ---------- foto ---------- */
  function photoField(label) {
    var st = { data: null }, wrap = h('div', { class: 'photo' });
    var input = h('input', { type: 'file', accept: 'image/*' });
    var shot = h('button', { class: 'shot', type: 'button', text: '📷 ' + label, onclick: function () { input.click(); } });
    var img = h('img', { alt: 'Foto ' + label, hidden: true });
    input.addEventListener('change', function () {
      var f = input.files && input.files[0]; if (!f) return; shot.textContent = 'Menyiapkan foto…';
      shrink(f).then(function (d) { st.data = d; img.src = d; img.hidden = false; shot.textContent = 'Ganti ' + label.toLowerCase(); },
                     function () { shot.textContent = '📷 ' + label; toast('Foto tidak terbaca. Coba lagi.'); });
    });
    add(wrap, [input, shot, img]);
    wrap.get = function () { return st.data ? { data: st.data } : null; };
    return wrap;
  }
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { try { var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.72)); } catch (e) { reject(e); } };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('img')); }; im.src = url;
    });
  }

  /* ---------- kerangka ---------- */
  function nav() {
    var n = $('nav'); clear(n);
    PAGES.concat(S.boot.owner ? [null].concat(OWN) : []).forEach(function (p) {
      if (!p) return n.appendChild(h('span', { class: 'sep' }));
      n.appendChild(h('button', { type: 'button', class: (S.page === p[0] ? 'on' : '') + (p[0].indexOf('o-') === 0 ? ' own' : ''), text: p[1],
        onclick: function () { go(p[0]); } }));
    });
  }
  function go(page, sel) { S.page = page; S.sel = sel == null ? null : sel; S.kasEdit = null; window.scrollTo(0, 0); render(); if (page === 'o-dash' || page === 'o-log') loadDash(); }
  function render() {
    if (!S.boot) return;
    var all = PAGES.concat(OWN), t = all.filter(function (p) { return p[0] === S.page; })[0];
    $('title').textContent = t ? t[2] : ''; $('me').textContent = S.name;
    nav();
    var m = $('main'); clear(m);
    ({ todo: pTodo, kas: pKas, harian: pHarian, masuk: pMasuk, olahan: pOlahan, buka: pBuka, waste: pWaste, hitung: pHitung,
       'o-todo': oTodo, 'o-plan': oPlan, 'o-dash': oDash, 'o-log': oLog })[S.page](m);
    pasangCari(m);
  }

  /* ---------- 1 To-do ---------- */
  function pTodo(m) {
    var d = S.boot.dyn, n = d.todos.filter(function (t) { return t.done; }).length;
    add(m, [h('div', {}, h('div', { class: 'lbl', text: 'To-do hari ini' }), h('div', { class: 'hint', text: n + ' dari ' + d.todos.length + ' selesai. Tulisan merah bisa diklik.' }))]);

        fix.slice(0, 5).map(function (l) { return 'Perbaikan oleh ' + l.siapa + ': ' + l.ringkas; }), hitungHariIni < S.boot.daily.length ? ['Hitung stok hari ini baru ' + hitungHariIni + ' / ' + S.boot.daily.length + ' barang harian.'] : []), 'warn'],
      ['Fokus', bad.length ? ['Satu kali hitung stok yang benar-benar dihitung, lalu cek tally besok.'] : ['Jaga hitungan harian tetap lengkap.'], 'dark']
    ];
    lists.forEach(function (L) {
      var c = h('div', { class: 'card' + (L[2] === 'red' ? ' red' : '') , style: L[2] === 'warn' ? 'background:var(--warn)' : L[2] === 'dark' ? 'background:var(--burg);color:var(--cream)' : '' }, h('span', { class: 'lbl', text: L[0] }));
      (L[1].length ? L[1] : ['–']).forEach(function (t) { add(c, h('div', { style: 'font-size:14px;line-height:1.45;padding-left:12px;border-left:3px solid var(--line)', text: t })); });
      add(m, c);
    });
    add(m, h('button', { class: 'btn2', type: 'button', text: 'Hitung ulang tally', onclick: function () { S.dash = null; render(); loadDash(); } }));
  }
  function cekCards(m, c) {
    if (!c) return;
    if (c.err) { add(m, note('err', 'Cek mingguan gagal dihitung: ' + c.err)); return; }
    var th = function (cols) { return h('thead', {}, h('tr', {}, cols.map(function (t) { return h('th', { text: t }); }))); };
    // Food cost %
    var f = c.food, fc = h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'Mingguan · Food cost %' }));
    if (f && f.pct != null) {
      var col = f.pct > 35 ? 'var(--red)' : f.pct < 28 ? 'var(--okt)' : 'var(--brown)';
      add(fc, [h('h2', { style: 'font-size:30px;color:' + col, text: fmt(f.pct) + '%' }),
        h('div', { class: 'hint', text: dmy(f.dari) + ' → ' + dmy(f.sampai) + ' · target 28–35%. ' + (f.pct > 35 ? 'Di atas target: cek waste, porsi dan harga beli.' : f.pct < 28 ? 'Di bawah 28%: bagus, atau ada pembelian / hitungan yang belum dicatat.' : 'Dalam target.') }),
        h('div', { class: 'tbl' }, h('table', {}, h('tbody', {},
          [['Nilai stok awal (' + dmy(f.dari) + ')', f.awal], ['+ Pembelian bahan & packaging', f.beli], ['− Nilai stok akhir (' + dmy(f.sampai) + ')', f.akhir],
           ['= Pemakaian (COGS)', f.pakai], ['Penjualan (' + f.baris + ' baris)', f.jual]].map(function (r) { return h('tr', {}, h('td', { text: r[0] }), h('td', { style: 'text-align:right;font-weight:700', text: rp(r[1]) })); }))))]);
      if (f.tanpaHarga) add(fc, h('div', { class: 'sub', text: f.tanpaHarga + ' barang belum ada harganya di Overview, jadi dihitung Rp 0.' }));
    } else if (f) add(fc, h('div', { class: 'hint', text: 'Pemakaian ' + dmy(f.dari) + '–' + dmy(f.sampai) + ': ' + rp(f.pakai) + '. Penjualan belum ada, jadi % belum bisa dihitung.' }));
    (c.catatan || []).forEach(function (t) { add(fc, note('info', t)); });
    add(m, fc);
    // Harga naik
    var hc = h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'Bulanan · Harga beli naik' }));
    if (!c.naik.length) add(hc, h('div', { class: 'hint', text: 'Tidak ada harga yang naik dibanding pembelian pertama.' }));
    else { var tb = h('tbody'); c.naik.forEach(function (n) { add(tb, h('tr', {}, h('td', {}, h('b', { text: n.nama }), h('div', { class: 'sub', text: n.sku })),
        h('td', { text: rp(n.dari) + ' → ' + rp(n.ke) }), h('td', { style: 'color:var(--red);font-weight:700', text: '+' + fmt(n.pct) + '%' }))); });
      add(hc, h('div', { class: 'tbl' }, h('table', {}, th(['Barang', 'Harga pertama → terakhir', 'Naik']), tb))); }
    add(m, hc);
    // Barang tidak bergerak
    var dc = h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'Bulanan · Tidak bergerak 30 hari' }),
      h('div', { class: 'hint', text: 'Masih ada stok, tapi 30 hari tidak terjual, tidak dipakai produksi dan tidak dicatat waste. Pakai untuk menu spesial / promo, atau jangan diorder lagi.' }));
    var tabel = function (list) { var tb2 = h('tbody'); list.forEach(function (n) { add(tb2, h('tr', {}, h('td', {}, h('b', { text: n.nama }), h('div', { class: 'sub', text: n.sku })),
        h('td', { text: fmt(n.sisa) + ' ' + n.sat }), h('td', { style: 'text-align:right', text: n.rp ? rp(n.rp) : '–' }))); });
      return h('div', { class: 'tbl' }, h('table', {}, th(['Barang', 'Sisa (hitung terakhir)', 'Nilai']), tb2)); };
    var diam = c.diam.filter(function (n) { return n.resep; }), luar = c.diam.filter(function (n) { return !n.resep; });
    add(dc, diam.length ? tabel(diam) : h('div', { class: 'hint', text: 'Tidak ada.' }));
    if (luar.length) add(dc, [h('div', { class: 'lbl', style: 'margin-top:8px', text: 'Belum ada di resep Overview' }),
      h('div', { class: 'hint', text: 'Barang ini tidak tercantum di resep mana pun, jadi pemakaiannya tidak terhitung dari penjualan. Tambahkan ke Resep & COGS kalau dipakai di menu (mis. es batu, sambal), supaya tally & food cost lebih akurat.' }), tabel(luar)]);
    add(m, dc);
  }
  function oLog(m) {
    var x = S.dash;
    if (!x) { add(m, h('div', { class: 'hint', text: 'Memuat…' })); return; }
    var log = x.log || [], tday = dmy(today());
    var logins = {}; log.forEach(function (l) { if (l.jenis === 'Login' && l.waktu.indexOf(today().slice(8) + '/' + today().slice(5, 7)) === 0 && !logins[l.siapa]) logins[l.siapa] = l.waktu.slice(-5); });
    var c = h('div', { class: 'card' }, h('h2', { text: 'Siapa yang login hari ini' }));
    var names = Object.keys(logins); if (!names.length) add(c, h('div', { class: 'hint', text: 'Belum ada yang login hari ini (' + tday + ').' }));
    names.forEach(function (n) { add(c, h('div', { class: 'row' }, h('div', { class: 'tx' }, h('span', { class: 'nm', text: n }), h('span', { class: 'sub', text: 'masuk ' + logins[n] })))); });
    add(m, c);
    var f = S.logF || 'semua', c2 = h('div', { class: 'card' }, h('h2', { text: 'Key in & perbaikan' }));
    add(c2, h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [['semua', 'Semua'], ['Perbaikan', 'Perbaikan'], ['Key in', 'Key in']].map(function (o) {
      return h('button', { type: 'button', class: 'btn2' + (f === o[0] ? ' on' : ''), style: 'padding:0 14px', text: o[1], onclick: function () { S.logF = o[0]; render(); } }); })));
    var tb = h('tbody');
    log.filter(function (l) { return f === 'semua' || l.jenis === f; }).forEach(function (l) {
      add(tb, h('tr', {}, h('td', { text: l.waktu }), h('td', {}, h('b', { text: l.siapa })), h('td', {}, h('span', { class: 'chip ' + (l.jenis === 'Perbaikan' ? 'warn' : l.jenis === 'Login' ? 'blue' : ''), text: l.jenis })), h('td', { text: l.hal }), h('td', { text: l.ringkas })));
    });
    add(c2, h('div', { class: 'tbl' }, h('table', {}, h('thead', {}, h('tr', {}, ['Waktu', 'Siapa', 'Jenis', 'Halaman', 'Detail'].map(function (t) { return h('th', { text: t }); }))), tb)));
    add(m, c2);
    add(m, h('button', { class: 'btn2', type: 'button', text: 'Muat ulang', onclick: function () { S.dash = null; render(); loadDash(); } }));
  }

  /* ---------- masuk / keluar ---------- */
  function toLogin(note_) {
    S.token = null; store(null);
    $('app').hidden = true; $('boot').hidden = true; $('login').hidden = false;
    var box = $('login-msg'); clear(box); if (note_) add(box, note('err', note_));
    call('names').then(function (d) {
      var s = $('l-name'); clear(s); s.appendChild(h('option', { value: '', text: 'Pilih nama…' }));
      d.names.forEach(function (n) { s.appendChild(h('option', { value: n, text: n })); });
    }).catch(function (e) { add(box, note('err', e.message)); });
  }
  function doLogin() {
    var name = $('l-name').value, pin = $('l-pin').value.trim(), btn = $('l-go'), box = $('login-msg'); clear(box);
    if (!name) return add(box, note('err', 'Pilih nama dulu.'));
    if (!/^\d{4,8}$/.test(pin)) return add(box, note('err', 'PIN berupa 4–8 angka.'));
    btn.disabled = true; btn.textContent = 'Memeriksa…';
    call('login', { name: name, pin: pin }).then(function (d) {
      btn.disabled = false; btn.textContent = 'Masuk'; $('l-pin').value = '';
      S.token = d.token; S.name = d.name; store({ token: d.token, name: d.name }); start();
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Masuk'; add(box, note('err', e.message)); });
  }
  function start() {
    $('login').hidden = true; if (!S.boot) { $('boot').hidden = false; $('app').hidden = true; }
    $('refresh').classList.add('spin');
    return call('boot', {}).then(function (d) {
      S.boot = d; S.name = d.name; $('boot').hidden = true; $('app').hidden = false; $('refresh').classList.remove('spin'); render();
    }).catch(function (e) { $('refresh').classList.remove('spin'); if (e.code === 'AUTH') return toLogin(e.message); $('boot').hidden = false; clear($('boot')); add($('boot'), [h('h2', { text: 'Tidak bisa memuat' }), note('err', e.message), h('button', { class: 'btn', type: 'button', text: 'Coba lagi', onclick: start })]); });
  }
  $('l-go').addEventListener('click', doLogin);
  $('l-pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('refresh').addEventListener('click', function () { S.dash = null; start().then(function () { if (S.page === 'o-dash' || S.page === 'o-log') loadDash(); }); });
  $('me').addEventListener('click', function () { if (confirm('Keluar dari aplikasi?')) { call('logout', {}).finally(function () { toLogin(''); }); } });
  var st = stored();
  if (st && st.token) { S.token = st.token; S.name = st.name; start(); } else toLogin('');
})();
</script>
